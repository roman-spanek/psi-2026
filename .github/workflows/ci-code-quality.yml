name: CI (tests + local analysis)

on:
  push:
    branches:
      - "feature/**"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Pokud máte vše navázané v POMu na "verify", stačí jen tento krok.
      - name: Build + tests + checks (mvn verify)
        run: mvn -B -U -ntp clean verify

      # Volitelné: když chcete mít výstupy jako artefakty i při failu
      - name: Upload reports (surefire/failsafe + analysis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/checkstyle-result.xml
            **/target/site/**
            **/target/spotbugs*.xml
            **/target/spotbugs*.html